name: ZUKU player distribution

on:
  push:
    branches: [main]
    paths:
      - npm/player/**
      - packages/renderer/src/Command/service/CommandInitializeContext*
      - .github/workflows/publish.yml
  pull_request:
    paths:
      - npm/player/**
      - packages/renderer/src/Command/service/CommandInitializeContext*
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  integration:
    uses: ./.github/workflows/integration.yml
  package:
    needs: [lint, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Renderer capability regression
        run: >-
          npx --no-install vitest run
          packages/renderer/src/Command/service/CommandInitializeContextService.test.ts
          packages/renderer/src/Command/service/CommandInitializeContextFallback.test.ts
          packages/renderer/src/Command/service/CommandInitializeContextAcquisition.test.ts
          packages/renderer/src/CommandController.test.ts
          packages/core/src/Canvas/usecase/CanvasRendererRecoveryUseCase.test.ts
      - run: node npm/player/build.mjs
      - run: node npm/player/check-packed.mjs
      - name: Pack only the ZUKU distribution
        run: npm pack ./npm/player --pack-destination "$RUNNER_TEMP"

# This fork does not publish the upstream @next2d namespace.
# A release operator publishes the verified @zuku/player archive explicitly.
